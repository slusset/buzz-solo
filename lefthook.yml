# Local hook surface mirrors .github/workflows/ci.yml's lanes — keep the two
# in sync. Deliberate deviations:
# - A CI-workflow-only edit doesn't need a local test run, so workflow paths
#   are not in the globs.
# - Deletion-only surface changes do not trigger local hooks: lefthook 2.1.x
#   drops deleted paths from push-file discovery (`extractFiles` existence
#   check, repository.go). CI runs every lane unconditionally and catches them.
# - `commit-msg` has no glob: it rewrites the commit message, not files. Note
#   Git only runs it for `git commit` and `git merge` — other flows need their own
#   flag: `git rebase --signoff`, `git cherry-pick -s`.
pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: ["crates/**", "examples/countdown-bot/**"]
      run: just fmt
      stage_fixed: true

# Appends the DCO Signed-off-by trailer the required "DCO Check" enforces.
# `--if-exists doNothing` makes it idempotent and preserves an existing
# sign-off (including `git commit -s` and a different signer's trailer).
commit-msg:
  commands:
    signoff:
      run: 'git interpret-trailers --if-exists doNothing --trailer "Signed-off-by: $(git var GIT_COMMITTER_IDENT | sed ''s/ [0-9]* [+-][0-9]*$//'')" --in-place {1}'

pre-push:
  parallel: true
  commands:
    branch-skew:
      run: ./scripts/check-branch-skew.sh
    rust-tests:
      glob: ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "justfile"]
      run: just test-unit
    contracts:
      glob: ["scripts/buzz-ctx*", "scripts/buzz-runner", "scripts/buzz-steward", "scripts/test-buzz-*.sh", "scripts/testdata/**"]
      run: just handoff-check graph-check
    cloudflare-check:
      glob: ["cloudflare/**", "pnpm-lock.yaml"]
      run: just cloudflare-check
