id: sovereign-node-runtime
type: model
entity: SovereignNodeRuntime
aggregate: SovereignNodeRuntime
description: |
  The portable application boundary that operates one sovereign node context.
  It coordinates relay-core ports, synchronization, coherence observation,
  release compatibility, and declared host capabilities without depending on
  a particular operating system or granting the host domain authority.

sources:
  stories:
    - specs/stories/node-runtime/place-synchronization-inside-node-runtime.md
    - specs/stories/node-runtime/declare-host-capabilities-without-domain-authority.md
    - specs/stories/node-runtime/observe-boundary-coherence.md
    - specs/stories/node-runtime/promote-compatible-node-runtime.md
  journeys:
    - specs/journeys/evolve-a-sovereign-node-runtime.md
  architecture:
    - specs/architecture/node-runtime-boundary-v0.1.md
    - specs/architecture/node-host-boundary-v0.1.md

identity:
  fields: [node_principal]
  description: |
    A runtime operates one stable node principal. Host labels, process IDs,
    service names, paths, release versions, and transport keys may change
    without changing node identity.

attributes:
  node_principal:
    type: NodePrincipal
    required: true
    immutable: true
  owner_identity:
    type: OwnerIdentity
    required: true
    immutable: true
  node_context:
    type: NodeContextReference
    required: true
    description: References the durable journal, profile, cursors, and context heads.
  runtime_release:
    type: RuntimeReleaseEvidence
    required: true
  host_binding:
    type: HostCapabilityBinding
    required: false
  lifecycle_state:
    type: enum
    required: true
    derived: true
    values: [unbound, starting, ready, degraded, blocked, quiescing, stopped]
    see: node-runtime.lifecycle.yaml
  sync_sessions:
    type: list<SyncSession>
    required: true
    derived: true
  coherence_observations:
    type: list<CoherenceObservation>
    required: true
    derived: true

entities:
  - name: RuntimeCheckpoint
    identity: checkpoint_id
    immutable: true
    attributes:
      - checkpoint_id
      - node_principal
      - runtime_release_digest
      - journal_head
      - cursor_heads
      - profile_schema
      - created_at
      - checkpoint_signer
      - signature
    description: |
      Durable evidence that replay and cursor state were coherent at a named
      boundary. A checkpoint records facts; it does not grant authority.
  - name: HostCapabilityBinding
    identity: [node_principal, manifest_digest]
    attributes:
      - node_principal
      - manifest_digest
      - adapter_id
      - required_profile
      - compatibility_state
      - bound_at
    description: |
      The node's explicit selection of one verified host capability manifest.
      It binds mechanical abilities to the runtime without importing host facts
      into the journal or node identity.

value_objects:
  - name: NodePrincipal
    representation: stable_principal_uri
  - name: OwnerIdentity
    representation: nostr_public_key
  - name: NodeContextReference
    representation: [profile_schema, journal_head, cursor_store_revision]
    purpose: Names durable node state independently of filesystem placement.
  - name: RuntimeReleaseEvidence
    representation: [version, source_revision, artifact_digest, signature, compatibility_claims]
    purpose: Proves provenance, integrity, and declared compatibility; never journal authority.
  - name: JournalHead
    representation: [last_event_id, event_count, content_hash]
  - name: CapabilityProfile
    representation: named_versioned_requirement_set
  - name: NodeCheckpointSignature
    representation: [signer_pubkey, signed_checkpoint_digest, signature]
    purpose: Attests the checkpoint evidence without authorizing journal transitions.

relationships:
  active_host_binding:
    type: has-zero-or-one-current
    entity: HostCapabilityBinding
  checkpoints:
    type: has-many
    entity: RuntimeCheckpoint
  synchronization_attempts:
    type: has-many
    entity: SyncSession
  observations:
    type: has-many-current-by-subject
    entity: CoherenceObservation

commands:
  - name: BindHostCapabilities
    actor: node_operator
    input: [verified_host_manifest, required_capability_profile]
    output: host_capability_binding
    preconditions:
      - manifest signature verifies
      - all required capabilities are declared
      - capability references resolve without exposing credential material
  - name: SelectRuntimeRelease
    actor: node_operator
    input: [verified_release_evidence, node_context, host_capability_binding]
    output: compatible_runtime_selection_or_refusal
    preconditions:
      - release provenance and artifact digest verify
      - profile and state schemas are compatible
      - required host capability profile is satisfied
  - name: StartRuntime
    actor: node_operator_or_host_supervisor
    input: [node_context, runtime_release, host_capability_binding]
    output: runtime_lifecycle_state
  - name: RequestSynchronization
    actor: node_runtime_trigger
    input: [trigger, current_declarations, source_bound_cursors]
    output: sync_session
    description: Every trigger enters the same node-owned synchronization procedure.
  - name: ObserveCoherence
    actor: node_runtime
    input: [invariant_id, subject, bounded_evidence]
    output: coherence_observation
    side_effects: none
  - name: CreateRuntimeCheckpoint
    actor: authorized_node_checkpoint_identity
    input: [runtime_release, journal_head, cursor_heads, profile_schema]
    output: signed_runtime_checkpoint
    preconditions:
      - journal and cursor heads are already durable
      - checkpoint digest covers every declared field
  - name: RecordCoherenceObservation
    actor: authorized_node_identity
    input: [coherence_observation]
    output: metadata_only_witness_event
    description: Separate from observation and subject to normal append policy.
  - name: QuiesceRuntime
    actor: node_operator_or_host_supervisor
    input: [reason]
    output: runtime_checkpoint_and_quiescing_state

rules:
  - id: synchronization-is-node-owned
    description: Stream selection, agreement evaluation, cursors, retries, and completion belong to this aggregate.
    enforced: domain
  - id: host-capabilities-are-mechanical
    description: Host start, stop, wake, placement, custody, session, and attestation effects never grant domain authority.
    enforced: authorization
  - id: triggers-share-one-procedure
    description: Startup, commits, peer wakes, recovery ticks, and operator requests enter one synchronization state machine.
    enforced: domain
  - id: release-selection-precedes-mutation
    description: Release and host compatibility are verified before a selected runtime mutates durable node state.
    enforced: application
  - id: observation-is-read-only
    description: Measuring coherence cannot repair state, append residue, or advance a cursor.
    enforced: application
  - id: recording-is-a-separate-command
    description: Persisting a coherence finding is an authorized metadata-only append after observation completes.
    enforced: authorization

invariants:
  - id: node-identity-is-host-independent
    description: A host label, path, service name, process ID, runtime version, or transport key never becomes node identity.
  - id: relay-core-remains-unaware-of-orchestration
    description: The portable relay core has no knowledge of scheduling, retry cadence, host lifecycle, or release selection.
  - id: host-wakes-carry-no-authority
    description: A wake conveys only that the runtime may evaluate work; it contains no trusted stream, cursor, or policy decision.
  - id: cursor-commit-follows-durability
    description: A source-bound cursor advances only after every covered record has a checkpoint-safe destination outcome.
  - id: exact-event-envelope-is-preserved
    description: Synchronization never rewrites event ID, author, kind, tags, content, or signature.
  - id: host-facts-stay-out-of-domain-history
    description: Paths, service labels, credential identifiers, and timer mechanisms remain host-local evidence rather than journal authority.
  - id: release-evidence-is-not-transition-authority
    description: A valid release proves provenance, integrity, and compatibility claims but cannot authorize journal replay or append.
  - id: checkpoint-signature-is-evidence-not-authority
    description: A valid runtime checkpoint attests observed durable heads but cannot make an invalid event, cursor, or replay admissible.
  - id: critical-coherence-is-never-averaged-away
    description: Coherence remains a vector of named observations; no scalar can conceal a violation or unknown critical invariant.
  - id: dependency-direction-points-inward
    description: Host, transport, storage, and executable adapters depend on node-runtime ports; domain and application logic never depend on adapter crates.

boundaries:
  inside:
    - runtime lifecycle and compatibility gate
    - synchronization procedure and retry classification
    - stream-agreement and transport-readiness orchestration
    - source-bound cursor ownership
    - coherence invariant evaluation
    - composition of portable relay ports for one node
  outside:
    - signed-event verification and relay reduction semantics
    - operating-system APIs and service-manager formats
    - filesystem path conventions and secret implementations
    - network transport implementations
    - release build and signing production
    - CLI, desktop, agent, and device presentation
